<!DOCTYPE html>
<html lang="en">
	<head>
		<meta charset="utf-8" />
		<meta name="viewport" content="width=device-width, initial-scale=1" />
		<meta name="apple-mobile-web-app-capable" content="yes">

		<!-- CPL favicons -->
		<link rel="apple-touch-icon" sizes="180x180" href="/cpl-logo.png">
		<link rel="icon" type="image/png" sizes="32x32" href="/cpl-logo.png">
		<link rel="icon" type="image/png" sizes="16x16" href="/cpl-logo.png">
		<link rel="mask-icon" href="/cpl-logo.png" color="#00316b">
		<link rel="shortcut icon" href="/cpl-logo.png">

		<meta name="apple-mobile-web-app-title" content="California Primeira Liga">
		<meta name="application-name" content="California Primeira Liga">
		<meta name="msapplication-TileColor" content="#505051">
		<meta name="theme-color" content="#ffffff">

		<!-- PWA -->
		<link rel="manifest" href="/manifest.json">

		<link rel="stylesheet" href="https://fonts.googleapis.com/icon?family=Material+Icons&display=swap" />
		<link rel="stylesheet" href="https://fonts.googleapis.com/css?family=Roboto:300,400,500,600,700&display=swap" />
		<link rel="stylesheet" href="https://fonts.googleapis.com/css?family=Roboto+Mono&display=swap" />

		<!-- SMUI Styles -->
		<link rel="stylesheet" href="/smui.css" media="(prefers-color-scheme: light)" />
		<link rel="stylesheet" href="/smui-dark.css" media="(prefers-color-scheme: dark)" />

		%sveltekit.head%

	<body>
		<div id="svelte">%sveltekit.body%</div>
